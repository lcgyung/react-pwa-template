# gitleaks 설정 — 기본 룰셋을 확장하고, 시크릿이 아닌 예시·문서·목 데이터만 allowlist 한다.
# 프론트는 번들에 들어간 시크릿이 그대로 노출되므로 특히 주의한다.
title = "react-pwa-template gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "예시·문서·목 데이터는 시크릿 스캔에서 제외(플레이스홀더·데모 계정 — 실제 비밀값 아님)"
paths = [
  '''\.env\.example$''',
  '''(^|/)docs/''',
  '''(^|/)src/app/mocks/''',
]
