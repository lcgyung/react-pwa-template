<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>오프라인 — React PWA Template</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        padding: 1.5rem;
        text-align: center;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }
      h1 {
        margin: 0;
        font-size: 1.5rem;
      }
      p {
        margin: 0;
        max-width: 28rem;
        color: #94a3b8;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <h1>오프라인 상태입니다</h1>
    <p>
      네트워크에 연결되어 있지 않습니다. 이미 방문한 화면은 캐시에서 계속 사용할 수 있으며, 연결이
      복구되면 자동으로 최신 상태로 동기화됩니다.
    </p>
  </body>
</html>
