server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # --- 보안 헤더 ---
  # CSP 는 서비스 워커(Workbox sw.js · MSW mockServiceWorker.js, 모두 동일출처)·앱 번들·
  # 교차출처 이미지/폰트 캐시(Workbox runtimeCaching)·Tailwind v4/sonner/Radix 런타임 <style>
  # 주입과 호환되게 구성한다. 자세한 근거·트레이드오프는 docs/adr/0005 참고.
  #   script-src 'self'        앱 번들 + 두 서비스 워커(importScripts 동일출처). unsafe-eval 불필요.
  #   worker-src 'self'        서비스 워커 등록 허용.
  #   style-src 'unsafe-inline' 런타임 <style> 주입 + public/offline.html 인라인 스타일.
  #                            정적 nginx 는 per-response nonce 를 줄 수 없어 의도적으로 허용(ADR-0005).
  #   img-src/font-src https:  교차출처 이미지/폰트 CDN(CacheFirst) + 인라인 SVG/data: 아이콘.
  #   connect-src 'self' https: axios → VITE_API_BASE_URL + 폰트/이미지 프리페치. 배포 시 도메인으로 좁혀라.
  #   frame-ancestors 'none'   클릭재킹 차단(+ 레거시 X-Frame-Options).
  set $csp "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https:; manifest-src 'self'; upgrade-insecure-requests";
  add_header Content-Security-Policy $csp always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;

  # SPA: 모든 경로를 index.html 로 폴백 (클라이언트 라우팅). add_header 가 없어 server 헤더를 상속.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 정적 에셋 캐싱 (해시 파일명 → 영구 캐시).
  # nginx 는 location 에 add_header 가 있으면 server 상속이 끊기므로 보안 헤더를 재선언한다.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Content-Security-Policy $csp always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
  }

  # PWA: 서비스 워커/매니페스트는 항상 재검증해 업데이트가 즉시 전파되도록 한다(보안 헤더 재선언).
  location = /sw.js {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy $csp always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy $csp always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
  }
}
