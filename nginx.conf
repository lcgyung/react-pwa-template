server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: 모든 경로를 index.html 로 폴백 (클라이언트 라우팅)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 정적 에셋 캐싱 (해시 파일명 → 영구 캐시)
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # PWA: 서비스 워커/매니페스트는 항상 재검증해 업데이트가 즉시 전파되도록 한다.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
  }
}
