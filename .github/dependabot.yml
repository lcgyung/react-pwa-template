version: 2
updates:
  # npm 의존성 (pnpm-lock.yaml 포함) — 월간, prod/dev 로 나눠 major 까지 한 PR 로 묶는다.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      production-deps:
        dependency-type: production
        update-types:
          - major
          - minor
          - patch
      development-deps:
        dependency-type: development
        update-types:
          - major
          - minor
          - patch
    ignore:
      # @types/node 는 성숙 메이저(^22) 유지 — CLAUDE.md "Node 버전 / 패키지 매니저" 정책
      # (갓 발행된 메이저는 pnpm minimumReleaseAge 게이트와 충돌, PR #22 참고)
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
      # eslint 10 보류 — eslint-plugin-react(<=7.37.5)·eslint-plugin-jsx-a11y(<=6.10.2)가
      # 아직 ESLint 10 미지원(peer ^9, react/* 룰이 ESLint 10 에서 로드 실패). 두 플러그인이
      # ESLint 10 대응 릴리스를 내면 이 두 항목을 제거하고 업그레이드 재개 (PR #25 참고).
      - dependency-name: 'eslint'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@eslint/js'
        update-types:
          - 'version-update:semver-major'

  # GitHub Actions 워크플로 액션 버전 — 월간, 전부 한 PR 로 묶는다.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - '*'
