version: 2
updates:
  # npm 의존성 (pnpm-lock.yaml 포함) — 주간, minor/patch 는 한 PR 로 묶는다.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions 워크플로 액션 버전 — 주간, minor/patch 그룹핑.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types:
          - minor
          - patch
