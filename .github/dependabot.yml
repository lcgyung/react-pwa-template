version: 2
updates:
  # npm 의존성 (pnpm-lock.yaml 포함) — 월간, prod/dev 로 나눠 major 까지 한 PR 로 묶는다.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      production-deps:
        dependency-type: production
        update-types:
          - major
          - minor
          - patch
      development-deps:
        dependency-type: development
        update-types:
          - major
          - minor
          - patch
    ignore:
      # @types/node 는 성숙 메이저(^22) 유지 — CLAUDE.md "Node 버전 / 패키지 매니저" 정책
      # (갓 발행된 메이저는 pnpm minimumReleaseAge 게이트와 충돌, PR #22 참고)
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'

  # GitHub Actions 워크플로 액션 버전 — 월간, 전부 한 PR 로 묶는다.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - '*'
